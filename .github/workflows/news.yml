name: Cricket News Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # har 15 min
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          CHANNEL_TAG: ${{ vars.CHANNEL_TAG }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          USE_PHOTO: ${{ vars.USE_PHOTO }}
        run: python bot.py

      - name: Save posted list
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "update posted news" && git pull --rebase && git push)
